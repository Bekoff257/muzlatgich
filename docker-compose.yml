services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
  api:
    image: node:20
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter api dev"
    volumes:
      - ./:/app
    ports:
      - '4000:4000'
    env_file:
      - ./apps/api/.env
    depends_on:
      - mongo
volumes:
  mongo_data:
